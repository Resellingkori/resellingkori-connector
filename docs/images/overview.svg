<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">How the connector links your shop to ResellingKori</title>
  <desc id="d">Your WooCommerce shop sends orders to ResellingKori and receives status and tracking back. An optional sales-agent dashboard can also act on orders, and the shop re-checks every action.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#FFFFFF"/>

  <!-- Optional agent dashboard -->
  <rect x="340" y="22" width="280" height="96" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="480" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#78350F">Sales agent dashboard</text>
  <text x="480" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#78350F">Optional, switched on by you</text>
  <text x="480" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78350F">Your shop re-checks every action</text>

  <path d="M430 118 L200 168" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M530 118 L760 168" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" fill="none"/>

  <!-- Shop -->
  <rect x="40" y="168" width="270" height="130" rx="14" fill="#E0F2F1" stroke="#0F766E" stroke-width="2"/>
  <text x="175" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#134E4A">Your WooCommerce shop</text>
  <text x="175" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#134E4A">You keep your own prices</text>
  <text x="175" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#134E4A">and your own customers</text>
  <text x="175" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#134E4A">Connector plugin 1.1.0</text>

  <!-- ResellingKori -->
  <rect x="650" y="168" width="270" height="130" rx="14" fill="#E0E7F5" stroke="#1F3A5F" stroke-width="2"/>
  <text x="785" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">ResellingKori</text>
  <text x="785" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E293B">Packs, ships and collects</text>
  <text x="785" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E293B">the cash on delivery</text>
  <text x="785" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E293B">resellingkori.com</text>

  <!-- Order flow: shop to ResellingKori -->
  <line x1="312" y1="208" x2="644" y2="208" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="478" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">1. Send order</text>
  <text x="478" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Signed, with your selling price</text>

  <!-- Status flow: ResellingKori to shop -->
  <line x1="650" y1="268" x2="316" y2="268" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="480" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">2. Status and tracking</text>
  <text x="480" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Signed webhook, with a 15-minute check as backup</text>

  <!-- Footer -->
  <text x="480" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Every request is signed with HMAC-SHA256. Your secret is never sent, and the plugin talks only to resellingkori.com.</text>
</svg>
