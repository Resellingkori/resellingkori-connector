<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">Sending an order to ResellingKori</title>
  <desc id="d">Open the order, press Review and send, check the figures, confirm. If the answer is lost, press Check status instead of sending again.</desc>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"/>
    </marker>
  </defs>
  <rect width="960" height="280" fill="#FFFFFF"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="20" y="40" width="160" height="90" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">1  Open order</text>
    <text x="100" y="102" text-anchor="middle" font-size="12" fill="#334155">WooCommerce → Orders</text>

    <rect x="200" y="40" width="160" height="90" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="280" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">2  Review</text>
    <text x="280" y="102" text-anchor="middle" font-size="12" fill="#334155">Press "Review and send"</text>

    <rect x="380" y="40" width="160" height="90" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="460" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">3  Check</text>
    <text x="460" y="102" text-anchor="middle" font-size="12" fill="#334155">Your price, profit, cash</text>

    <rect x="560" y="40" width="160" height="90" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="640" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">4  Confirm</text>
    <text x="640" y="102" text-anchor="middle" font-size="12" fill="#334155">"Confirm and send"</text>

    <rect x="740" y="40" width="200" height="90" rx="12" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="840" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">5  Sent</text>
    <text x="840" y="102" text-anchor="middle" font-size="12" fill="#134E4A">ResellingKori packs and ships</text>

    <line x1="182" y1="85" x2="198" y2="85" stroke="#0F172A" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="362" y1="85" x2="378" y2="85" stroke="#0F172A" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="542" y1="85" x2="558" y2="85" stroke="#0F172A" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="722" y1="85" x2="738" y2="85" stroke="#0F172A" stroke-width="2" marker-end="url(#arr3)"/>

    <!-- Lost answer branch -->
    <line x1="640" y1="132" x2="640" y2="168" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr3)"/>
    <text x="652" y="154" font-size="12" fill="#78350F">Answer lost?</text>
    <rect x="440" y="170" width="400" height="80" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="640" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#78350F">Box says "not confirmed"</text>
    <text x="640" y="224" text-anchor="middle" font-size="13" fill="#78350F">Press Check status. Never send the order again.</text>
  </g>
  <text x="20" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Each send is confirmed on screen.</text>
  <text x="20" y="222" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">A double click or a lost connection cannot</text>
  <text x="20" y="242" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">create two orders at ResellingKori.</text>
</svg>
