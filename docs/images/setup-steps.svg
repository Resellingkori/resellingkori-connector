<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="t d">
  <title id="t">Six setup steps in WooCommerce → ResellingKori</title>
  <desc id="d">Welcome, Connect, Verify, Products, Orders, Finish. Each step is a short check or a single action.</desc>
  <rect width="960" height="240" fill="#FFFFFF"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Step 1 -->
    <rect x="20" y="50" width="140" height="110" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="34" r="16" fill="#1F3A5F"/>
    <text x="90" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="90" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Welcome</text>
    <text x="90" y="110" text-anchor="middle" font-size="12" fill="#334155">Checks WooCommerce,</text>
    <text x="90" y="128" text-anchor="middle" font-size="12" fill="#334155">HTTPS and currency</text>

    <!-- Step 2 -->
    <rect x="176" y="50" width="140" height="110" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="246" cy="34" r="16" fill="#1F3A5F"/>
    <text x="246" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="246" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Connect</text>
    <text x="246" y="110" text-anchor="middle" font-size="12" fill="#334155">Paste the Key ID</text>
    <text x="246" y="128" text-anchor="middle" font-size="12" fill="#334155">and the Secret</text>

    <!-- Step 3 -->
    <rect x="332" y="50" width="140" height="110" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="402" cy="34" r="16" fill="#1F3A5F"/>
    <text x="402" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="402" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Verify</text>
    <text x="402" y="110" text-anchor="middle" font-size="12" fill="#334155">Check that the store</text>
    <text x="402" y="128" text-anchor="middle" font-size="12" fill="#334155">and agent are yours</text>

    <!-- Step 4 -->
    <rect x="488" y="50" width="140" height="110" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="558" cy="34" r="16" fill="#1F3A5F"/>
    <text x="558" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="558" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Products</text>
    <text x="558" y="110" text-anchor="middle" font-size="12" fill="#334155">Link by SKU first,</text>
    <text x="558" y="128" text-anchor="middle" font-size="12" fill="#334155">then review the rest</text>

    <!-- Step 5 -->
    <rect x="644" y="50" width="140" height="110" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="714" cy="34" r="16" fill="#1F3A5F"/>
    <text x="714" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
    <text x="714" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Orders</text>
    <text x="714" y="110" text-anchor="middle" font-size="12" fill="#334155">Which statuses may</text>
    <text x="714" y="128" text-anchor="middle" font-size="12" fill="#334155">be sent, and options</text>

    <!-- Step 6 -->
    <rect x="800" y="50" width="140" height="110" rx="12" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
    <circle cx="870" cy="34" r="16" fill="#0F766E"/>
    <text x="870" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">6</text>
    <text x="870" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Finish</text>
    <text x="870" y="110" text-anchor="middle" font-size="12" fill="#334155">Summary, then send</text>
    <text x="870" y="128" text-anchor="middle" font-size="12" fill="#334155">your first order</text>

    <!-- Arrows between steps -->
    <path d="M162 105 L174 105" stroke="#0F172A" stroke-width="2" marker-end="url(#arr2)"/>
    <path d="M318 105 L330 105" stroke="#0F172A" stroke-width="2" marker-end="url(#arr2)"/>
    <path d="M474 105 L486 105" stroke="#0F172A" stroke-width="2" marker-end="url(#arr2)"/>
    <path d="M630 105 L642 105" stroke="#0F172A" stroke-width="2" marker-end="url(#arr2)"/>
    <path d="M786 105 L798 105" stroke="#0F172A" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- Footer -->
    <text x="480" y="208" text-anchor="middle" font-size="13" fill="#334155">Step 3 must show "Connected" before the Continue button becomes available.</text>
  </g>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"/>
    </marker>
  </defs>
</svg>
