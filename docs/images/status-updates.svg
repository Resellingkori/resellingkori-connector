<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d">
  <title id="t">How order status reaches your shop</title>
  <desc id="d">ResellingKori sends status changes to your shop by signed webhook. If that is not possible, your shop asks ResellingKori every 15 minutes about open orders. Delivered completes your order by default.</desc>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"/>
    </marker>
  </defs>
  <rect width="960" height="260" fill="#FFFFFF"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="60" width="250" height="110" rx="14" fill="#E0E7F5" stroke="#1F3A5F" stroke-width="2"/>
    <text x="155" y="104" text-anchor="middle" font-size="19" font-weight="700" fill="#1E293B">ResellingKori</text>
    <text x="155" y="130" text-anchor="middle" font-size="13" fill="#1E293B">Status, courier and tracking</text>

    <rect x="680" y="60" width="250" height="110" rx="14" fill="#E0F2F1" stroke="#0F766E" stroke-width="2"/>
    <text x="805" y="104" text-anchor="middle" font-size="19" font-weight="700" fill="#134E4A">Your shop</text>
    <text x="805" y="130" text-anchor="middle" font-size="13" fill="#134E4A">Order box and order status</text>

    <!-- Primary path: webhook -->
    <line x1="282" y1="95" x2="676" y2="95" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arr4)"/>
    <text x="479" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Signed webhook, as it happens</text>

    <!-- Backup path: periodic check -->
    <line x1="676" y1="140" x2="286" y2="140" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr4)"/>
    <text x="479" y="162" text-anchor="middle" font-size="13" fill="#78350F">Backup: your shop asks every 15 minutes (open orders only)</text>

    <rect x="680" y="196" width="250" height="44" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="805" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Delivered → order completed</text>
    <line x1="805" y1="170" x2="805" y2="194" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arr4)"/>
  </g>
  <text x="30" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Other statuses appear as a badge. You can change this mapping in Settings.</text>
</svg>
